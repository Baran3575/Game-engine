<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Engine Studio - build 3D games in your browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
<div id="app">

  <aside id="sidebar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24"><path d="M12 2 20 6.5v11L12 22l-8-4.5v-11L12 2z"/><path d="M12 22v-11M20 6.5 12 11M4 6.5 12 11"/></svg>
      </div>
      <div class="brand-text">Game Engine<br><b>Studio</b></div>
    </div>

    <nav id="nav">
      <button class="nav-btn active" data-tab="scene">
        <svg viewBox="0 0 24 24"><path d="M12 2 20 6.5v11L12 22l-8-4.5v-11L12 2z"/><path d="M12 22v-11M20 6.5 12 11M4 6.5 12 11"/></svg>
        <span>Scene</span>
      </button>
      <button class="nav-btn" data-tab="graph">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="19" r="2.4"/><circle cx="19" cy="5" r="2.4"/><circle cx="19" cy="19" r="2.4"/><path d="M7 17.5 17 6.5M19 7.4v9.2M5 7.4v9.2M7 6.5l10 11"/></svg>
        <span>Blueprint</span>
      </button>
      <button class="nav-btn" data-tab="scripts">
        <svg viewBox="0 0 24 24"><path d="m14 6 6 6-6 6M10 6l-6 6 6 6"/></svg>
        <span>Scripts</span>
      </button>
    </nav>

    <div class="side-head">
      <span>Projects</span>
      <button id="btn-new" title="New project">+</button>
    </div>
    <div id="side-projects"></div>
  </aside>

  <div id="main">
    <header id="topbar">
      <div class="seg">
        <button id="btn-play" class="accent">&#9654; Play</button>
        <button id="btn-stop" title="Stop">&#9632;</button>
      </div>
      <input id="project-name" class="pname" placeholder="Untitled" spellcheck="false">
      <span class="sep"></span>
      <button id="btn-save">Save</button>
      <span class="spacer"></span>
      <span id="bridge-status" class="status"><span class="dot"></span><span class="status-text">MCP offline</span></span>
      <button id="btn-bridge-settings" class="icon-btn" title="MCP bridge settings">&#9881;</button>
      <button id="btn-console" class="icon-btn" title="Toggle console">&#9776;</button>
    </header>

    <main>
      <section id="panel-scene" class="panel active">
        <div id="scene-container">
          <div id="hint">Drag to orbit &middot; scroll to zoom &middot; click an object to select</div>
          <div id="scene-tools">
            <button id="add-box">+ Box</button>
            <button id="add-sphere">+ Sphere</button>
            <button id="add-cylinder">+ Cylinder</button>
          </div>
        </div>
        <aside id="inspector">
          <div class="insp-head">
            <h3>Scene Objects</h3>
            <div class="btn-row">
              <button id="btn-dup">Duplicate</button>
              <button id="btn-del">Delete</button>
            </div>
          </div>
          <div id="obj-list"></div>
          <h3 id="props-title" class="hidden">Properties</h3>
          <div id="props"></div>
        </aside>
      </section>

      <section id="panel-graph" class="panel">
        <div id="graphDiv"></div>
      </section>

      <section id="panel-scripts" class="panel">
        <div class="script-bar">
          <button id="btn-run-script" class="accent">Run Script</button>
          <span>Scripts run together with the Blueprint graph when you press Play.</span>
        </div>
        <textarea id="script-input" spellcheck="false" autocomplete="off" placeholder="// game.spawn({ type: 'box', name: 'hero', y: 5 })"></textarea>
      </section>
    </main>

    <footer id="console">
      <div id="log"></div>
    </footer>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="js/engine.js?v=3"></script>
<script src="js/graph.js?v=3"></script>
<script src="js/bridge.js?v=3"></script>
<script src="js/app.js?v=3"></script>
</body>
</html>
